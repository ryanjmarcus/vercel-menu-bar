name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-14
    env:
      HAS_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      HAS_HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Get version from tag or input
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
      
      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "No certificate provided, skipping..."
            exit 0
          fi
          
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          
          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Add to keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          
          rm $RUNNER_TEMP/certificate.p12
          echo "Certificate imported successfully"
      
      - name: Setup Notarization Credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_ID_PASSWORD" ]; then
            echo "No notarization credentials provided, skipping..."
            exit 0
          fi
          
          xcrun notarytool store-credentials "notarization-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_ID_PASSWORD"
          echo "Notarization credentials stored"
      
      - name: Add Sparkle Package
        run: |
          xcodebuild -resolvePackageDependencies \
            -project vercel-menu-bar.xcodeproj \
            -scheme vercel-menu-bar
      
      - name: Build and Sign App
        run: |
          # Set signing identity based on whether certificate is available
          if [ -n "$HAS_CERTIFICATE" ]; then
            SIGNING_IDENTITY="Developer ID Application: Ryan Marcus (JM7ZEPER79)"
            CODE_SIGNING_REQUIRED="YES"
          else
            SIGNING_IDENTITY="-"
            CODE_SIGNING_REQUIRED="NO"
          fi
          
          echo "Building with signing identity: $SIGNING_IDENTITY"
          
          # Build the archive
          xcodebuild archive \
            -project vercel-menu-bar.xcodeproj \
            -scheme vercel-menu-bar \
            -configuration Release \
            -archivePath build/VercelMenuBar.xcarchive \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGNING_REQUIRED="$CODE_SIGNING_REQUIRED" \
            CODE_SIGNING_ALLOWED=YES
          
          # Export the app
          mkdir -p build/export
          cp -R "build/VercelMenuBar.xcarchive/Products/Applications/vercel-menu-bar.app" "build/export/Vercel Menu Bar.app"
      
      - name: Deep Sign App for Notarization
        run: |
          if [ -z "$HAS_CERTIFICATE" ]; then
            echo "No certificate, skipping deep signing..."
            exit 0
          fi
          
          SIGNING_IDENTITY="Developer ID Application: Ryan Marcus (JM7ZEPER79)"
          APP_PATH="build/export/Vercel Menu Bar.app"
          ENTITLEMENTS="vercel-menu-bar/vercel-menu-bar.entitlements"
          
          # Sign Sparkle framework components (inside-out signing order)
          if [ -d "$APP_PATH/Contents/Frameworks/Sparkle.framework" ]; then
            # Sign XPC services
            find "$APP_PATH/Contents/Frameworks/Sparkle.framework" -name "*.xpc" -type d | while read xpc; do
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$xpc" || true
            done
            
            # Sign helper apps
            find "$APP_PATH/Contents/Frameworks/Sparkle.framework" -name "*.app" -type d | while read app; do
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$app" || true
            done
            
            # Sign standalone binaries
            find "$APP_PATH/Contents/Frameworks/Sparkle.framework" -type f -perm +111 ! -name "*.dylib" | while read binary; do
              if file "$binary" | grep -q "Mach-O"; then
                codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$binary" || true
              fi
            done
            
            # Sign the framework itself
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework" || true
          fi
          
          # Sign other frameworks and dylibs
          find "$APP_PATH/Contents/Frameworks" -name "*.framework" -type d -maxdepth 1 2>/dev/null | while read framework; do
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$framework" || true
          done
          find "$APP_PATH/Contents/Frameworks" -name "*.dylib" -type f 2>/dev/null | while read dylib; do
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$dylib" || true
          done
          
          # Sign the main app
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" "$APP_PATH"
          
          # Verify
          codesign --verify --deep --strict "$APP_PATH"
          echo "Deep signing complete"
      
      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Vercel Menu Bar" \
            -srcfolder build/export \
            -ov \
            -format UDZO \
            "build/Vercel-Menu-Bar-${{ steps.get_version.outputs.VERSION }}.dmg"
      
      - name: Sign DMG
        run: |
          if [ -z "$HAS_CERTIFICATE" ]; then
            echo "No certificate, skipping DMG signing..."
            exit 0
          fi
          
          codesign --force --sign "Developer ID Application: Ryan Marcus (JM7ZEPER79)" \
            "build/Vercel-Menu-Bar-${{ steps.get_version.outputs.VERSION }}.dmg"
          echo "DMG signed"
      
      - name: Notarize DMG
        run: |
          if [ -z "$HAS_NOTARIZATION" ]; then
            echo "No notarization credentials, skipping..."
            exit 0
          fi
          
          xcrun notarytool submit "build/Vercel-Menu-Bar-${{ steps.get_version.outputs.VERSION }}.dmg" \
            --keychain-profile "notarization-profile" \
            --wait
          
          # Staple the notarization ticket
          xcrun stapler staple "build/Vercel-Menu-Bar-${{ steps.get_version.outputs.VERSION }}.dmg"
          echo "Notarization complete"
      
      - name: Create ZIP
        run: |
          cd build/export
          zip -r "../Vercel-Menu-Bar-${{ steps.get_version.outputs.VERSION }}.zip" "Vercel Menu Bar.app"
      
      - name: Sign update with Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "No Sparkle key, skipping..."
            exit 0
          fi
          
          # Download Sparkle tools
          curl -L -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz
          mkdir -p sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools
          
          # Sign the ZIP file and get the signature
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_private_key
          SIGNATURE=$(./sparkle-tools/bin/sign_update "build/Vercel-Menu-Bar-${{ steps.get_version.outputs.VERSION }}.zip" -f /tmp/sparkle_private_key)
          rm /tmp/sparkle_private_key
          
          # Parse signature (format: sparkle:edSignature="..." length="...")
          ED_SIGNATURE=$(echo "$SIGNATURE" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          LENGTH=$(echo "$SIGNATURE" | grep -o 'length="[^"]*"' | cut -d'"' -f2)
          
          echo "ED_SIGNATURE=$ED_SIGNATURE" >> $GITHUB_ENV
          echo "LENGTH=$LENGTH" >> $GITHUB_ENV
      
      - name: Update appcast.xml
        run: |
          if [ -z "$ED_SIGNATURE" ]; then
            echo "No Sparkle signature, skipping appcast update..."
            exit 0
          fi
          
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          DATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")
          
          # Create appcast item using printf (avoids heredoc YAML issues)
          printf '        <item>\n' > /tmp/new_item.xml
          printf '            <title>Version %s</title>\n' "$VERSION" >> /tmp/new_item.xml
          printf '            <pubDate>%s</pubDate>\n' "$DATE" >> /tmp/new_item.xml
          printf '            <sparkle:version>%s</sparkle:version>\n' "$VERSION" >> /tmp/new_item.xml
          printf '            <sparkle:shortVersionString>%s</sparkle:shortVersionString>\n' "$VERSION" >> /tmp/new_item.xml
          printf '            <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>\n' >> /tmp/new_item.xml
          printf '            <enclosure\n' >> /tmp/new_item.xml
          printf '                url="https://github.com/ryanjmarcus/vercel-menu-bar/releases/download/v%s/Vercel-Menu-Bar-%s.zip"\n' "$VERSION" "$VERSION" >> /tmp/new_item.xml
          printf '                sparkle:edSignature="%s"\n' "$ED_SIGNATURE" >> /tmp/new_item.xml
          printf '                length="%s"\n' "$LENGTH" >> /tmp/new_item.xml
          printf '                type="application/octet-stream"/>\n' >> /tmp/new_item.xml
          printf '            <sparkle:releaseNotesLink>https://github.com/ryanjmarcus/vercel-menu-bar/releases/tag/v%s</sparkle:releaseNotesLink>\n' "$VERSION" >> /tmp/new_item.xml
          printf '        </item>\n' >> /tmp/new_item.xml
          
          # Use awk for multi-line insertion
          awk '/<!-- Updates will be automatically added here by GitHub Actions -->/{print; system("cat /tmp/new_item.xml"); next}1' docs/appcast.xml > /tmp/appcast_new.xml
          mv /tmp/appcast_new.xml docs/appcast.xml
      
      - name: Commit appcast.xml update
        run: |
          if [ -z "$ED_SIGNATURE" ]; then
            echo "No Sparkle signature, skipping commit..."
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "Update appcast.xml for v${{ steps.get_version.outputs.VERSION }}" || echo "No changes to commit"
          git push origin HEAD:main || echo "Could not push to main"
      
      - name: Calculate SHA256 for Homebrew
        id: sha256
        run: |
          SHA256=$(shasum -a 256 "build/Vercel-Menu-Bar-${{ steps.get_version.outputs.VERSION }}.dmg" | cut -d' ' -f1)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT
      
      - name: Create and Push Tag
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" || echo "Tag already exists"
          git push origin "v$VERSION" || echo "Tag already pushed"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Vercel Menu Bar v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Installation
            
            ### Download Directly
            1. Download `Vercel-Menu-Bar-${{ steps.get_version.outputs.VERSION }}.dmg`
            2. Open the DMG and drag the app to your Applications folder
            3. Launch the app from Applications
            
            ### Using Homebrew
            ```bash
            brew install ryanjmarcus/tap/vercel-menu
            ```
            
            ## What's New
            
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
            
            ---
            <details>
            <summary>Homebrew Cask Info</summary>
            
            SHA256: `${{ steps.sha256.outputs.SHA256 }}`
            </details>
          files: |
            build/Vercel-Menu-Bar-${{ steps.get_version.outputs.VERSION }}.dmg
            build/Vercel-Menu-Bar-${{ steps.get_version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "No Homebrew token, skipping..."
            exit 0
          fi
          
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          SHA256="${{ steps.sha256.outputs.SHA256 }}"
          
          # Clone the tap repository
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ryanjmarcus/homebrew-tap.git /tmp/homebrew-tap || exit 0
          
          # Create/update the cask formula
          mkdir -p /tmp/homebrew-tap/Casks
          cat > /tmp/homebrew-tap/Casks/vercel-menu.rb << 'CASK_EOF'
          cask "vercel-menu" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA256_PLACEHOLDER"
            url "https://github.com/ryanjmarcus/vercel-menu-bar/releases/download/v#{version}/Vercel-Menu-Bar-#{version}.dmg"
            name "Vercel Menu Bar"
            desc "Menu bar app for monitoring Vercel deployments"
            homepage "https://github.com/ryanjmarcus/vercel-menu-bar"
            depends_on macos: ">= :sonoma"
            app "Vercel Menu Bar.app"
            zap trash: ["~/Library/Preferences/com.ryanmarcus.vercel-menu-bar.plist"]
          end
          CASK_EOF
          
          # Replace placeholders
          sed -i '' "s/VERSION_PLACEHOLDER/$VERSION/" /tmp/homebrew-tap/Casks/vercel-menu.rb
          sed -i '' "s/SHA256_PLACEHOLDER/$SHA256/" /tmp/homebrew-tap/Casks/vercel-menu.rb
          
          # Commit and push
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/vercel-menu.rb
          git commit -m "Update vercel-menu to v$VERSION" || echo "No changes"
          git push || echo "Could not push to homebrew-tap"
